name: Benchmarking

on:
  pull_request:

jobs:
  benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Install Dependencies
        run: julia --project=benchmarks/ -e 'using Pkg; Pkg.instantiate()'

      - name: Run Benchmarks
        id: run_benchmarks
        run: |
          # Capture the output of versioninfo and benchmark results
          version_info=$(julia -e 'using InteractiveUtils; versioninfo()')
          benchmark_output=$(julia --project=benchmarks benchmarks/benchmarks.jl)

          # Set the versioninfo and benchmark output as GitHub Actions outputs
          echo "version_info=$version_info" >> $GITHUB_ENV
          echo "benchmark_output=$benchmark_output" >> $GITHUB_ENV

      - name: Find Existing Comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]

      - name: Post Benchmark Results as PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Computer Information
            \`\`\`
            ${{ env.version_info }}
            \`\`\`
            ## Benchmark Report
            ${{ env.benchmark_output }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
