name: Benchmarking

on:
  pull_request:

jobs:
  benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Install Dependencies
        run: julia --project=benchmarks/ -e 'using Pkg; Pkg.instantiate()'

      - name: Run Benchmarks
        id: run_benchmarks
        run: |
          # Capture version info
          {
            echo "VERSION_INFO<<EOF"
            julia -e 'using InteractiveUtils; versioninfo()'
            echo "EOF"
          } >> $GITHUB_ENV

          # Capture benchmark results
          {
            echo "BENCHMARK_OUTPUT<<EOF"
            julia --project=benchmarks benchmarks/benchmarks.jl
            echo "EOF"
          } >> $GITHUB_ENV

          # Print benchmark results to the workflow log
          echo "Benchmark Results:"
          echo "$BENCHMARK_OUTPUT"

      - name: Find Existing Comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]

      - name: Post Benchmark Results as PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Computer Information
            ```
            ${{ env.VERSION_INFO }}
            ```
            ## Benchmark Report
            ${{ env.BENCHMARK_OUTPUT }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
